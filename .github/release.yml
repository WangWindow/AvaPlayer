changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
    authors:
      - dependabot

  categories:
    - title: "Breaking Changes"
      labels:
        - breaking-change
        - breaking
    - title: "Features"
      labels:
        - enhancement
        - feature
    - title: "Bug Fixes"
      labels:
        - bug
        - bugfix
        - fix
    - title: "Performance"
      labels:
        - performance
        - optimization
    - title: "Other Changes"
      labels:
        - "*"
